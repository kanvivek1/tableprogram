<!DOCTYPE html>
<html>
<head>
  <title>Table and Form</title>
  <style>
    body {
      background-color: lightblue;
      font-family: Arial, sans-serif;
    }

  <!-- Form -->
  <form>
    <h2>Registration Form</h2>
    <label>First Name:
      <input type="text" name="firstname">
    </label>
    <label>Last Name:
      <input type="text" name="lastname">
    </label>
    <label>Email:
      <input type="email" name="email">
    </label>

    <label>
      <input type="checkbox" name="subscribe"> Subscribe to newsletter
    </label>

    <p>Select your favorite subject (Radio buttons):</p>
    <label><input type="radio" name="subject" value="Math"> Mathematics</label>
    <label><input type="radio" name="subject" value="Science"> Science</label>
    <label><input type="radio" name="subject" value="History"> History</label>
    <label><input type="radio" name="subject" value="English"> English</label>

    <label>Choose a city:
      <select name="city">
        <option value="Mumbai">Mumbai</option>
        <option value="Pune">Pune</option>
        <option value="Thane">Thane</option>
        <option value="Delhi">Delhi</option>
      </select>
    </label>

    <br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
