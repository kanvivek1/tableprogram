<!DOCTYPE html>
<html>
<head>
  <title>Easy Table</title>
  <style>
    table {
      border-collapse: collapse;
      width: 60%;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }
    .row1 td { background-color: lightblue; color: darkred; }
    .row2 td { background-color: lightgreen; color: navy; }
    .row3 td { background-color: lightyellow; color: purple; }
  </style>
</head>
<body>
  <table>
    <tr>
      <th>Roll No</th>
      <th>Name</th>
      <th>Address</th>
    </tr>
    <tr class="row1">
      <td>101</td>
      <td>Alice</td>
      <td>Mumbai</td>
    </tr>
    <tr class="row2">
      <td>102</td>
      <td>Bob</td>
      <td>Pune</td>
    </tr>
    <tr class="row3">
      <td>103</td>
      <td>Charlie</td>
      <td>Thane</td>
    </tr>
  </table>
</body>
</html>
