<!DOCTYPE html>
<html>
<head>
  <title>Simple Registration Form</title>
  <style>
    body {
      background-color: lightblue;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* full screen height */
      margin: 0;
    }

    form {
      background-color: white;
      border: 1px solid black;
      padding: 20px;
      width: 300px;
      text-align: left;
    }

    input, select {
      width: 100%;
      margin-bottom: 10px;
    }

    input[type="checkbox"], input[type="radio"] {
      width: auto;
    }

    input[type="submit"] {
      background-color: blue;
      color: white;
      border: none;
      padding: 8px;
      cursor: pointer;
      width: 100%;
    }

    input[type="submit"]:hover {
      background-color: darkblue;
    }
  </style>
</head>
<body>
  <form>
    <h3>Registration Form</h3>

    First Name: <input type="text" name="firstname"><br>
    Last Name: <input type="text" name="lastname"><br>
    Email: <input type="email" name="email"><br>

    <input type="checkbox" name="subscribe"> Subscribe to newsletter<br><br>

    Favorite subject:<br>
    <input type="radio" name="subject" value="Math"> Mathematics<br>
    <input type="radio" name="subject" value="Science"> Science<br>
    <input type="radio" name="subject" value="History"> History<br>
    <input type="radio" name="subject" value="English"> English<br><br>

    Choose a city:
    <select name="city">
      <option>Mumbai</option>
      <option>Pune</option>
      <option>Thane</option>
      <option>Delhi</option>
    </select><br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
